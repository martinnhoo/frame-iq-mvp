# Worker do Creative Intelligence no Fly.io.
#
# gru (São Paulo) e não iad: o banco é o Supabase e o gargalo é o download do
# CDN da Meta, não a latência até o Postgres. Manter perto de você facilita
# depurar, e o custo é o mesmo.

app = "adbrief-ci-worker"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

[env]
  CI_WORKER_ID = "fly-ci-worker"
  # 1, não 2. Whisper "small" sozinho ocupa ~1 GB; dois jobs simultâneos com
  # ffmpeg + OCR + leitura de frames estouram os 2 GB. E o OOM não é isolado:
  # o job morre, volta à fila, e morre de novo — em laço. Só subir depois de
  # medir memória real com vídeos de 15s, 30s, 60s e 90s em 1080x1920.
  CI_WORKER_CONCURRENCY = "1"
  CI_TMP_DIR = "/data/tmp"
  CI_TMP_MAX_MB = "4096"
  CI_STORAGE_BACKEND = "supabase"
  CI_STORAGE_BUCKET = "ci-media"
  # OCR ligado, via tesseract (vem no Dockerfile, ~30 MB). easyocr leria melhor
  # texto estilizado, mas arrasta o torch e disputaria os 2 GB com o Whisper.
  # Sem motor instalado o estágio é PULADO e aparece em amarelo na UI — degrada
  # visível, não em silêncio.
  CI_OCR = "true"
  CI_WHISPER_MODEL = "small"

# Sem [http_service] de propósito: o worker não atende requisição. Ele só
# consome a fila do Postgres. Não expor porta significa que nada da internet
# fala com o processo que segura a SUPABASE_SERVICE_ROLE_KEY.

[[vm]]
  size = "shared-cpu-2x"
  memory = "4gb"
  # 2 GB não bastaram. Medido em 07/08 com anúncios REAIS da Shapermint: a
  # máquina morria sempre no mesmo ponto, o job voltava para a fila em
  # attempt 2, e morria de novo — o laço de OOM que o comentário anterior
  # dizia estar evitado. A diferença entre a estimativa e a realidade foi o
  # vídeo: os de teste tinham 10s e 320x176; anúncio de verdade tem 30s+ em
  # 1080x1920, e o Whisper carrega o modelo inteiro na memória antes de olhar
  # a duração.
  #
  # O OOM do Fly não escreve "out of memory" no log: a máquina simplesmente
  # reinicia. O sinal é o attempt subindo sempre no mesmo estágio.
  #
  # Para não pagar 4 GB parado: `fly scale count 0` quando não estiver
  # processando. O checkpoint no banco garante que retomar não repaga o Gemini.

[[mounts]]
  source = "ci_worker_data"
  destination = "/data"
  # Volume só para temporários. Nada persistente mora aqui: o estado vive no
  # Postgres e as mídias no bucket. Se o volume sumir, os jobs em andamento
  # voltam à fila pelo reaper e nada se perde.

[deploy]
  strategy = "immediate"
  # Não há health check HTTP para esperar — o worker não tem porta. O SIGTERM
  # é tratado: ele para de pegar job novo e termina o que está em execução
  # antes de sair.
