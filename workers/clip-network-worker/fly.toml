app = "adbrief-clip-worker"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

[env]
  CLIP_AI_EDITOR_VERSION = "5"
  V4_VISION_SAMPLE_FPS = "6"
  V4_X264_PRESET = "superfast"
  V4_X264_CRF = "28"
  V4_FFMPEG_THREADS = "2"
  V4_ASD_THREADS = "2"
  V4_ASD_PROXY_MAX_SIDE = "640"
  V4_ASD_DETECT_FPS = "5"
  V4_ASD_AMBIGUITY_PAD_SECONDS = "0.4"
  V5_SCALE_FLAGS = "bicubic"
  V5_X264_PRESET = "superfast"
  V5_X264_CRF = "26"
  V5_STAGE_X264_PRESET = "superfast"
  V5_STAGE_X264_CRF = "18"
  V5_FFMPEG_THREADS = "2"
  V4_LR_ASD_WEIGHTS = "/app/vision/lrasd_talkset.model"
  V4_MAX_OUTPUT_BYTES = "47185920"
  CLIP_WORKER_ID = "fly-clip-worker"
  CLIP_TMP_DIR = "/data/tmp"
  CLIP_BUCKET = "clip-network"
  CLIP_ORCHESTRATOR_MODEL = "gpt-4o-mini"
  CLIP_WORKER_POLL_MS = "30000"
  CLIP_LEASE_SECONDS = "900"
  CLIP_IDLE_SHUTDOWN_MS = "90000"
  CLIP_MAX_HEIGHT = "1080"
  CLIP_MIN_SOURCE_DURATION_SECONDS = "181"

[[vm]]
  size = "performance-2x"
  memory = "4gb"

[[mounts]]
  source = "clip_worker_data"
  destination = "/data"

[deploy]
  strategy = "immediate"

[[restart]]
  policy = "on-failure"
